<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - SportClub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather+Sans:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2E1A47;
            --primary-hover: #402565;
            --accent-color: #F2B705;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body.auth-body {
            background: linear-gradient(rgba(46, 26, 71, 0.7), rgba(0, 0, 0, 0.8)), url('assets/gimnasio2.webp') no-repeat center center fixed !important;
            background-size: cover !important;
            font-family: 'Merriweather Sans', sans-serif !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 850px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .login-logo-img {
            max-width: 350px;
            height: auto;
            filter: drop-shadow(2px 0px 0px rgba(255, 255, 255, 0.85)) 
                    drop-shadow(-2px 0px 0px rgba(255, 255, 255, 0.85)) 
                    drop-shadow(0px 2px 0px rgba(255, 255, 255, 0.85)) 
                    drop-shadow(0px -2px 0px rgba(255, 255, 255, 0.85));
        }

        .login-card {
            background-color: var(--card-bg);
            border: 3px solid var(--accent-color);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .login-card h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 1px;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 15px;
            width: fit-content;
        }

        .btn-volver:hover {
            background-color: var(--primary-color);
            color: #ffffff;
            transform: translateX(-4px);
        }

        /* Estilos de los inputs antiguos */
        .input-group-custom {
            margin-bottom: 15px;
        }

        .input-group-custom label, .section-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #333;
            background-color: #fff;
        }
        
        .form-control:focus, .form-select:focus, .form-check-input:focus {
            outline: none !important;
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 5px rgba(252, 209, 42, 0.5) !important;
        }

        .form-check-input:checked {
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
        }

        /* Botón morado clásico */
        .btn-ingresar {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #FFFFFF;
            border: 3px solid var(--accent-color);
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .btn-ingresar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Estilos para errores (Mantenidos de tu código) */
        .error-text {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: none;
        }
        .is-invalid {
            border-color: #dc3545 !important;
        }
    </style>
</head>

<body class="auth-body">

    <main class="register-container">
        <header class="logo-container">
            <img src="assets/logo_empresa_letra_v1.png" alt="SportClub Logo" class="login-logo-img">
        </header>

        <section class="login-card">
            
            <button type="button" onclick="history.back()" class="btn-volver">
                ← Volver
            </button>

            <h1>Registrarse</h1>
            
            <form id="register-form" novalidate>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-6 input-group-custom">
                        <label for="nombre">Nombre *:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingresa tu nombre">
                        <div id="error-nombre" class="error-text">El nombre es obligatorio.</div>
                    </div>

                    <div class="col-md-6 input-group-custom">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" class="form-control" placeholder="Ingresa tus apellidos">
                        <div id="error-apellidos" class="error-text"></div>
                    </div>

                    <div class="col-md-6 input-group-custom">
                        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="form-control">
                        <div id="error-fecha_nacimiento" class="error-text"></div>
                    </div>

                    <div class="col-md-6 input-group-custom">
                        <label for="correo">Correo Electrónico *:</label>
                        <input type="email" id="correo" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>
                        <div id="error-correo" class="error-text">El correo es obligatorio.</div>
                    </div>

                    <div class="col-md-6 input-group-custom">
                        <label for="contrasena">Contraseña *:</label>
                        <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="Mínimo 8 caracteres" required>
                        <div id="error-contrasena" class="error-text">La contraseña es obligatoria.</div>
                    </div>

                    <div class="col-md-6 input-group-custom">
                        <label for="confirmar_contrasena">Confirmar Contraseña *:</label>
                        <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" class="form-control" placeholder="Repite tu contraseña" required>
                        <div id="error-confirmar_contrasena" class="error-text">Debes confirmar la contraseña.</div>
                    </div>

                    <div class="col-md-6 input-group-custom">
                        <label for="practica_deporte">¿Practicas algún deporte?</label>
                        <select id="practica_deporte" name="practica_deporte" class="form-select">
                            <option value="" selected disabled>Selecciona una opción</option>
                            <option value="si">Sí, regularmente</option>
                            <option value="ocasional">De vez en cuando</option>
                            <option value="no">No, soy principiante</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4 text-muted">

                <div class="row g-4 mb-3">
                    <div class="col-md-6">
                        <label class="section-label">Actividades que te interesan:</label>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" value="musculacion" id="act_musculacion" name="intereses[]">
                            <label class="form-check-label text-muted small fw-semibold" for="act_musculacion">Musculatura / Máquinas</label>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" value="cardio" id="act_cardio" name="intereses[]">
                            <label class="form-check-label text-muted small fw-semibold" for="act_cardio">Cardio / Spinning</label>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" value="clases" id="act_clases" name="intereses[]">
                            <label class="form-check-label text-muted small fw-semibold" for="act_clases">Clases Dirigidas (Zumba, Yoga)</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="section-label">¿Cuál es tu objetivo principal? *</label>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="radio" name="objetivo" id="obj_peso" value="perder_peso" required>
                            <label class="form-check-label text-muted small fw-semibold" for="obj_peso">Perder peso / Quemar grasa</label>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="radio" name="objetivo" id="obj_masa" value="ganar_masa">
                            <label class="form-check-label text-muted small fw-semibold" for="obj_masa">Ganar masa muscular / Fuerza</label>
                        </div>
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="radio" name="objetivo" id="obj_salud" value="salud">
                            <label class="form-check-label text-muted small fw-semibold" for="obj_salud">Salud / Resistencia física</label>
                        </div>
                    </div>
                </div>

                <p id="register-msg" class="text-center mt-3 small fw-bold" style="display: none;"></p>
                
                <button type="submit" class="btn-ingresar">Completar Registro</button>
            </form>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
