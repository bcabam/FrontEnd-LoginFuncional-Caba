<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #C9CBD1 !important; 
        }

        .btn-custom {
            background-color: #7B61FF;
            color: white;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        .btn-custom:hover {
            background-color: #6a52e0;
            color: white;
            transform: scale(1.02);
        }

        .animacion-error {
            animation: deslizarAparecer 0.4s ease-out forwards;
        }
        
        @keyframes deslizarAparecer {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <main class="container" style="max-width: 400px;">
        <div class="card shadow p-4 rounded-3 border-0">
            <div class="card-body">
                
                <h2 class="text-center fw-bold text-dark mb-1">Inicio de Sesión</h2>
                <p class="text-center text-muted small mb-4">Accede a tu cuenta</p>
                
                <form id="login-form" novalidate>
                    <div class="mb-3">
                        <label for="correo" class="form-label fw-semibold small">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control" placeholder="tu@correo.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label fw-semibold small">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" class="form-control" placeholder="Contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-custom w-100 fw-bold">
                        Ingresar
                    </button>
                    
                    <p id="error-msg" class="text-danger text-center mt-3 small fw-bold animacion-error" style="display: none;">
                        La dirección de correo o la contraseña no son correctas.
                    </p>
                </form>

                <hr class="my-4 text-muted">

                <footer class="text-center small">
                    <div class="mb-2">
                        <a href="#" class="text-decoration-none text-primary">¿Olvidaste tu contraseña?</a>
                        <span class="text-muted mx-2">|</span>
                        <a href="#" class="text-decoration-none text-primary">Registrarse</a>
                    </div>
                    <div class="mb-3">
                        <a href="#" class="text-decoration-none text-dark fw-semibold">Volver a Inicio</a>
                    </div>
                    <div class="text-muted pt-2">
                        ¿No tienes cuenta? <a href="#" class="text-decoration-none text-primary">Crear una nueva</a>
                    </div>
                </footer>

            </div>
        </div>
    </main>

    <script src="js/users.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
