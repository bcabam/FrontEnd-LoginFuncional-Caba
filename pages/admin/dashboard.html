<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

    <h1>Bienvenid@, <span id="nombre-usuario"></span></h1>
    
    <p>Has accedido exitosamente al panel.</p>
    <a href="../../index.html" class="btn btn-secondary mt-3">Cerrar Sesión</a>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        
        if (user && user.fullname) {
            document.getElementById('nombre-usuario').textContent = user.fullname;
        } else {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
